name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            node: '20'
          - python: '3.12'
            node: '22'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ matrix.node }}'
      - name: Python syntax and tests
        run: |
          python3 -m pip install -r requirements-images.txt
          python3 -m py_compile ungrok.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Adapter syntax and tests
        run: |
          node --check vendor/xai-prompt-session.cjs
          node --test tests/*.test.cjs
      - name: CLI entry point and whitespace
        run: |
          ./ungrok --help
          ./ungrok --version
          git diff --check
